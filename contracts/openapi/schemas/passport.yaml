Session:
  type: object
  required:
    - token
    - expiresAt
    - userId
  additionalProperties: false
  properties:
    token:
      type: string
      description: >-
        Opaque bearer token (256-bit, base64url). Shown exactly once — only
        its SHA-256 hash is stored server-side (ADR-010).
    expiresAt:
      type: string
      format: date-time
    userId:
      type: string
      format: uuid

CheckinRequest:
  type: object
  required:
    - stopId
    - clientMutationId
    - observedAt
  additionalProperties: false
  properties:
    stopId:
      type: string
      format: uuid
    clientMutationId:
      type: string
      format: uuid
      description: >-
        Client-generated idempotency key (docs/24). Replays with the same key
        return the original row with `replayed: true`, never a duplicate.
    observedAt:
      type: string
      format: date-time
      description: When the user says the visit happened (client clock).
    lat:
      type: number
      format: double
      minimum: -90
      maximum: 90
      description: >-
        Device fix latitude. Must be sent together with `lon`; omitting both
        records a manual (unverified) check-in.
    lon:
      type: number
      format: double
      minimum: -180
      maximum: 180

Visit:
  type: object
  required:
    - id
    - stopId
    - observedAt
    - validationMethod
    - status
    - createdAt
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    stopId:
      type: string
      format: uuid
    observedAt:
      type: string
      format: date-time
    validationMethod:
      type: string
      enum: [geofence, manual, trip]
      description: >-
        Derived server-side from evidence, never claimed by the client:
        `geofence` when a device fix was evaluated, `manual` when none was
        supplied, `trip` reserved for dwell/trip-context check-ins.
    status:
      type: string
      enum: [confirmed, low_confidence]
      description: >-
        `confirmed` = fix inside the geofence radius; `low_confidence` =
        outside it or no fix at all. Low-confidence visits are still
        recorded honestly (docs/42: mark, don't block).
    distanceM:
      type: number
      format: double
      description: Meters between the fix and the stop (geofence check-ins only).
    createdAt:
      type: string
      format: date-time

CheckinResponse:
  type: object
  required:
    - visit
    - replayed
  additionalProperties: false
  properties:
    visit:
      $ref: '#/Visit'
    replayed:
      type: boolean
      description: true when the idempotency key matched an existing row.

VisitList:
  type: object
  required:
    - visits
  additionalProperties: false
  properties:
    visits:
      type: array
      items:
        $ref: '#/Visit'

ProgressCount:
  type: object
  required: [visitedStops, totalStops]
  additionalProperties: false
  properties:
    visitedStops:
      type: integer
      format: int64
      minimum: 0
    totalStops:
      type: integer
      format: int64
      minimum: 0

JournalRequest:
  type: object
  required: [body]
  additionalProperties: false
  properties:
    stopId:
      type: string
      format: uuid
    visitEventId:
      type: string
      format: uuid
      description: Link to one of the caller's own visit events.
    body:
      type: string
      minLength: 1
      maxLength: 2000
    baseUpdatedAt:
      type: string
      format: date-time
      description: PATCH only — optimistic version check against `updatedAt`.

JournalEntry:
  type: object
  required: [id, body, visibility, createdAt, updatedAt]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    stopId:
      type: string
      format: uuid
    visitEventId:
      type: string
      format: uuid
    body:
      type: string
    visibility:
      type: string
      enum: [private]
      description: Private by default — the only value the API accepts today.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

PassportProgress:
  allOf:
    - $ref: '#/ProgressCount'
    - type: object
      required: [byMode, byRoute, byCollection]
      additionalProperties: false
      properties:
        byMode:
          type: array
          items:
            allOf:
              - $ref: '#/ProgressCount'
              - type: object
                required: [mode]
                additionalProperties: false
                properties:
                  mode:
                    type: string
        byRoute:
          type: array
          items:
            allOf:
              - $ref: '#/ProgressCount'
              - type: object
                required: [routeId, routeKey, name, mode]
                additionalProperties: false
                properties:
                  routeId:
                    type: string
                    format: uuid
                  routeKey:
                    type: string
                    description: Provider entity id of the corridor, e.g. "TJ:4B".
                  name:
                    type: string
                  mode:
                    type: string
                  color:
                    type: string
                    description: Corridor hex color (no leading #) when known.
        byCollection:
          type: array
          description: >-
            Progress inside each published curated collection (docs/42).
          items:
            allOf:
              - $ref: '#/ProgressCount'
              - type: object
                required: [collectionId, slug, title]
                additionalProperties: false
                properties:
                  collectionId:
                    type: string
                    format: uuid
                  slug:
                    type: string
                  title:
                    type: string
