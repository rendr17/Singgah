SourceMeta:
  type: object
  description: Provenance of the upstream provider row.
  required:
    - provider
  additionalProperties: false
  properties:
    provider:
      type: string
      description: Canonical provider code, e.g. commute
    fetchedAt:
      type: string
      format: date-time
      description: When the provider row was ingested
    sourceUpdatedAt:
      type: string
      format: date-time
      description: Upstream update timestamp reported by the provider

StationSummary:
  type: object
  required:
    - id
    - name
    - kind
    - lat
    - lon
    - providerCode
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      description: Canonical Singgah UUID
    name:
      type: string
    code:
      type: string
      description: Public station code, e.g. SUD
    kind:
      type: string
      enum:
        - station
        - stop
        - platform
        - entrance
    lat:
      type: number
    lon:
      type: number
    providerCode:
      type: string

RouteRef:
  type: object
  required:
    - id
    - mode
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    shortName:
      type: string
    longName:
      type: string
    mode:
      type: string
      enum:
        - rail
        - subway
        - tram
        - bus
        - ferry
        - other
    color:
      type: string
      description: Hex color without leading '#'
    agencyCode:
      type: string
    agencyName:
      type: string

RouteSummary:
  allOf:
    - $ref: '#/RouteRef'
    - type: object
      required:
        - providerCode
      additionalProperties: false
      properties:
        providerCode:
          type: string

StopRef:
  type: object
  description: Lightweight stop reference embedded in other resources.
  required:
    - id
    - name
    - lat
    - lon
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    code:
      type: string
    lat:
      type: number
    lon:
      type: number

Transfer:
  type: object
  required:
    - toStop
  additionalProperties: false
  properties:
    toStop:
      $ref: '#/StopRef'
    walkDistanceM:
      type: integer
    notes:
      type: string

Facility:
  type: object
  description: >-
    Provider-declared amenity. accessibilityRelevant classifies the type only —
    presence says nothing about whether the facility works today (docs/41).
  required:
    - type
  additionalProperties: false
  properties:
    type:
      type: string
      description: 'Canonical lowercase amenity type, e.g. toilet, elevator_paid, toilet_accessible'
    text:
      type: string
      description: Provider location note, e.g. "Concourse"
    accessibilityRelevant:
      type: boolean

StationDetail:
  allOf:
    - $ref: '#/StationSummary'
    - type: object
      required:
        - lines
        - transfers
        - facilities
        - source
      additionalProperties: false
      properties:
        officialName:
          type: string
        lines:
          type: array
          items:
            $ref: '#/RouteRef'
        transfers:
          type: array
          items:
            $ref: '#/Transfer'
        facilities:
          type: array
          items:
            $ref: '#/Facility'
        source:
          $ref: '#/SourceMeta'

RouteDetail:
  allOf:
    - $ref: '#/RouteSummary'
    - type: object
      required:
        - stops
        - source
      additionalProperties: false
      properties:
        stops:
          type: array
          description: >-
            Served stops sorted by name — authoritative stop ordering arrives
            with line/trip ingest, so this list is not a sequence diagram yet.
          items:
            $ref: '#/StopRef'
        source:
          $ref: '#/SourceMeta'

Provider:
  type: object
  description: >-
    Data-provider registry row with its ingest freshness signal.
    lastSuccessAt absent means registered but never successfully ingested.
  required:
    - code
    - name
    - isActive
  additionalProperties: false
  properties:
    code:
      type: string
    name:
      type: string
    licenseName:
      type: string
    attributionText:
      type: string
    allowedUse:
      type: string
    refreshCadence:
      type: string
    owner:
      type: string
    knownLimitations:
      type: string
    isActive:
      type: boolean
    lastSuccessAt:
      type: string
      format: date-time

JourneyStopRef:
  type: object
  description: >-
    Stop reference inside an itinerary. `id` is absent when the upstream
    station ref cannot be resolved to a canonical stop (external service).
  required:
    - name
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string

JourneyLeg:
  type: object
  required:
    - type
    - from
    - to
  additionalProperties: false
  properties:
    type:
      type: string
      description: walk | ride | raw upstream type for unrecognised legs
    from:
      $ref: '#/JourneyStopRef'
    to:
      $ref: '#/JourneyStopRef'
    distanceM:
      type: number
    routeId:
      type: string
      format: uuid
      description: Canonical route UUID for ride legs
    line:
      type: string
      description: Provider line key, e.g. MRTJ:M — diagnostic only
    operator:
      type: string
    stationCount:
      type: integer
    stops:
      type: array
      description: Ordered stops ridden — real sequence from the provider
      items:
        $ref: '#/JourneyStopRef'
    headsign:
      type: string

FareSegment:
  type: object
  required:
    - operator
    - from
    - to
    - amount
  additionalProperties: false
  properties:
    operator:
      type: string
    from:
      $ref: '#/JourneyStopRef'
    to:
      $ref: '#/JourneyStopRef'
    amount:
      type: integer
      format: int64
      description: IDR integer — money is never a float

Fare:
  type: object
  required:
    - currency
    - segments
  additionalProperties: false
  properties:
    currency:
      type: string
      enum:
        - IDR
    total:
      type: integer
      format: int64
    segments:
      type: array
      items:
        $ref: '#/FareSegment'

Itinerary:
  type: object
  required:
    - legs
    - walkTransfers
    - rideLegs
    - totalDistanceM
    - status
  additionalProperties: false
  properties:
    legs:
      type: array
      items:
        $ref: '#/JourneyLeg'
    walkTransfers:
      type: integer
      description: Count of walk legs — computed from legs, not the provider's transferCount
    rideLegs:
      type: integer
    fare:
      $ref: '#/Fare'
    totalDistanceM:
      type: number
    status:
      type: string
      enum:
        - scheduled
      description: Static provider data — never live until realtime lands

JourneyPlan:
  type: object
  required:
    - from
    - to
    - itinerary
    - source
  additionalProperties: false
  properties:
    from:
      $ref: '#/JourneyStopRef'
    to:
      $ref: '#/JourneyStopRef'
    itinerary:
      oneOf:
        - $ref: '#/Itinerary'
        - type: 'null'
      description: null when the provider computes no plan for the pair
    source:
      type: object
      required:
        - provider
        - requestedAt
      additionalProperties: false
      properties:
        provider:
          type: string
        requestedAt:
          type: string
          format: date-time
