SourceMeta:
  type: object
  description: Provenance of the upstream provider row.
  required:
    - provider
  additionalProperties: false
  properties:
    provider:
      type: string
      description: Canonical provider code, e.g. commute
    fetchedAt:
      type: string
      format: date-time
      description: When the provider row was ingested
    sourceUpdatedAt:
      type: string
      format: date-time
      description: Upstream update timestamp reported by the provider

StationSummary:
  type: object
  required:
    - id
    - name
    - kind
    - lat
    - lon
    - providerCode
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      description: Canonical Singgah UUID
    name:
      type: string
    code:
      type: string
      description: Public station code, e.g. SUD
    kind:
      type: string
      enum:
        - station
        - stop
        - platform
        - entrance
    lat:
      type: number
    lon:
      type: number
    providerCode:
      type: string
    operator:
      type: string
      description: >-
        Provider-declared operator code (e.g. TJ, MRTJ, KCI, LRTJ, LRTJBDB).
        Empty when the provider does not survey it — clients key official
        brand marks off this field.
    lines:
      type: array
      description: >-
        Catalog routes serving this stop — populated on text search
        (combobox badges); absent on bbox and reference listings.
      items:
        $ref: '#/RouteRef'

RouteRef:
  type: object
  required:
    - id
    - mode
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    shortName:
      type: string
    longName:
      type: string
    mode:
      type: string
      enum:
        - rail
        - subway
        - tram
        - bus
        - ferry
        - other
    color:
      type: string
      description: Hex color without leading '#'
    agencyCode:
      type: string
    agencyName:
      type: string

RouteSummary:
  allOf:
    - $ref: '#/RouteRef'
    - type: object
      required:
        - providerCode
      additionalProperties: false
      properties:
        providerCode:
          type: string

StopRef:
  type: object
  description: Lightweight stop reference embedded in other resources.
  required:
    - id
    - name
    - lat
    - lon
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    code:
      type: string
    lat:
      type: number
    lon:
      type: number

Transfer:
  type: object
  required:
    - toStop
  additionalProperties: false
  properties:
    toStop:
      $ref: '#/StopRef'
    walkDistanceM:
      type: integer
    notes:
      type: string

Facility:
  type: object
  description: >-
    Provider-declared amenity. accessibilityRelevant classifies the type only —
    presence says nothing about whether the facility works today (docs/41).
  required:
    - type
  additionalProperties: false
  properties:
    type:
      type: string
      description: 'Canonical lowercase amenity type, e.g. toilet, elevator_paid, toilet_accessible'
    text:
      type: string
      description: Provider location note, e.g. "Concourse"
    accessibilityRelevant:
      type: boolean

StationDetail:
  allOf:
    - $ref: '#/StationSummary'
    - type: object
      required:
        - lines
        - transfers
        - facilities
        - source
      additionalProperties: false
      properties:
        officialName:
          type: string
        lines:
          type: array
          items:
            $ref: '#/RouteRef'
        transfers:
          type: array
          items:
            $ref: '#/Transfer'
        facilities:
          type: array
          items:
            $ref: '#/Facility'
        source:
          $ref: '#/SourceMeta'

RouteStop:
  type: object
  description: >-
    StopRef plus its position on the route. seq is the flattened provider
    order across segments; segmentKind preserves TRUNK/BRANCH topology.
  required:
    - id
    - name
    - lat
    - lon
    - seq
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    code:
      type: string
    lat:
      type: number
    lon:
      type: number
    seq:
      type: integer
      description: 1-based position across the route's flattened segments
    stationNumber:
      type: string
      description: Operator-facing number when published (M01, C07…)
    segmentKind:
      type: string
      description: 'Provider segment kind: TRUNK | BRANCH | upstream value'

RouteDetail:
  allOf:
    - $ref: '#/RouteSummary'
    - type: object
      required:
        - stops
        - source
      additionalProperties: false
      properties:
        stops:
          type: array
          description: >-
            Stops in the provider's declared line order (route_stops.seq).
            A route with no ingested sequence returns an empty list rather
            than an invented order.
          items:
            $ref: '#/RouteStop'
        source:
          $ref: '#/SourceMeta'

Provider:
  type: object
  description: >-
    Data-provider registry row with its ingest freshness signal.
    lastSuccessAt absent means registered but never successfully ingested.
  required:
    - code
    - name
    - isActive
  additionalProperties: false
  properties:
    code:
      type: string
    name:
      type: string
    licenseName:
      type: string
    attributionText:
      type: string
    allowedUse:
      type: string
    refreshCadence:
      type: string
    owner:
      type: string
    knownLimitations:
      type: string
    isActive:
      type: boolean
    lastSuccessAt:
      type: string
      format: date-time
    lastAttemptAt:
      type: string
      format: date-time
      description: >-
        Stamp of the most recent ingest attempt — newer than lastSuccessAt
        (or success absent) means the last run failed or is still running.

JourneyStopRef:
  type: object
  description: >-
    Stop reference inside an itinerary. `id` is absent when the upstream
    station ref cannot be resolved to a canonical stop (external service).
  required:
    - name
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string

JourneyLeg:
  type: object
  required:
    - type
    - from
    - to
  additionalProperties: false
  properties:
    type:
      type: string
      description: walk | ride
    from:
      $ref: '#/JourneyStopRef'
    to:
      $ref: '#/JourneyStopRef'
    distanceM:
      type: number
      description: Walk distance in metres — walk legs only
    depAt:
      type: string
      format: date-time
      description: Scheduled departure at the leg's origin (walk legs carry computed times)
    arrAt:
      type: string
      format: date-time
      description: Scheduled arrival at the leg's destination
    routeId:
      type: string
      format: uuid
      description: Canonical route UUID for ride legs
    line:
      type: string
      description: Provider line key, e.g. MRTJ:M — diagnostic only
    operator:
      type: string
    mode:
      type: string
      description: Catalog mode vocabulary — rail | subway | tram | bus | ferry | other
    color:
      type: string
      description: >-
        Corridor's published color — hex without '#', same convention as
        RouteRef.color. Absent when the catalog stores none.
    stationCount:
      type: integer
    stops:
      type: array
      description: Ordered stops ridden — real sequence from the schedule
      items:
        $ref: '#/JourneyStopRef'
    headsign:
      type: string
    estimated:
      type: boolean
      description: >-
        True when the leg's times come from a frequency template or a
        reconstructed stop_time rather than a published trip time
    geometry:
      $ref: '#/LegShape'
    nextDepartures:
      type: array
      description: >-
        Upcoming boardings at leg.from on this route — populated on the
        first ride leg only, computed from the same schedule snapshot.
      items:
        $ref: '#/Departure'
    alternatives:
      type: array
      description: >-
        Other catalog routes that also carry this leg's endpoints —
        corridors the rider can board instead of the planner's pick, each
        verified against a scheduled trip actually riding from→to. Omitted
        entirely when the plan contains a no-transfer itinerary: corridor
        choices only exist for journeys that genuinely need one.
      items:
        $ref: '#/JourneyLegAlternative'

LegShape:
  type: object
  description: >-
    GeoJSON LineString sliced from an ingested route shape (GTFS) between
    the leg's endpoints. Absent when the route has no ingested shape that
    hugs the listed stops — clients then draw the stop-to-stop polyline.
  required:
    - type
    - coordinates
  properties:
    type:
      type: string
      enum:
        - LineString
    coordinates:
      type: array
      items:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
      minItems: 2

JourneyLegAlternative:
  type: object
  description: >-
    A corridor that also serves the leg's endpoints. `stops` and `geometry`
    are derived from this alternative's own route_stops/shape rows — never
    borrowed from the provider's chosen leg.
  required:
    - routeId
    - line
    - stops
  additionalProperties: false
  properties:
    routeId:
      type: string
      format: uuid
    line:
      type: string
      description: Provider line key, e.g. TJ:2
    shortName:
      type: string
      description: Corridor/line code for chips — "2", "7F"
    name:
      type: string
      description: Corridor long name, e.g. "Pulo Gadung - Monumen Nasional"
    operator:
      type: string
    color:
      type: string
      description: >-
        Corridor's published color — hex without '#', same convention as
        RouteRef.color. Absent when the catalog stores none.
    stationCount:
      type: integer
      description: Stop-to-stop hops across the served slice
    stops:
      type: array
      description: Interior stops in ride order — leg endpoints excluded
      items:
        $ref: '#/JourneyStopRef'
    geometry:
      $ref: '#/LegShape'

Departure:
  type: object
  required:
    - time
    - tripNumber
    - boundFor
  additionalProperties: false
  properties:
    time:
      type: string
      description: Asia/Jakarta wall clock, HH:MM
      example: '07:04'
    tripNumber:
      anyOf:
        - type: string
        - type: 'null'
      description: Operator trip number — null when the operator publishes none
    boundFor:
      type: string
      description: Terminal station name, matching the leg's headsign
    estimated:
      type: boolean
      description: >-
        True when the time comes from a headway template (frequency-based
        service) or a derived row the source never published — ESTIMATED per
        docs/09, not a scheduled departure.

DepartureDirection:
  type: object
  description: >-
    One direction (boundFor) on a line. departures holds upcoming boardings
    inside the requested window, soonest first; previousDeparture is the
    latest boarding already gone inside the lookback window, absent when
    none is seen.
  required:
    - boundFor
    - departures
  additionalProperties: false
  properties:
    boundFor:
      type: string
      description: Terminal station name published by the provider
    departures:
      type: array
      items:
        $ref: '#/Departure'
    previousDeparture:
      $ref: '#/Departure'

DepartureLine:
  type: object
  description: >-
    Departures on one provider line serving the station. route is the
    canonical route when the provider line resolves to one — absent when it
    does not, in which case lineCode is the only identity shown.
  required:
    - lineCode
    - directions
  additionalProperties: false
  properties:
    lineCode:
      type: string
      description: Provider line code, e.g. B — diagnostic identity
    route:
      $ref: '#/RouteRef'
    directions:
      type: array
      items:
        $ref: '#/DepartureDirection'

StationDepartures:
  type: object
  description: >-
    A station's departure board. status is fixed "scheduled" — the source is
    the in-house schedule snapshot (GTFS + reconstructed timetables), never
    realtime. Lines and directions are ordered by soonest upcoming
    departure.
  required:
    - station
    - status
    - windowMinutes
    - lines
    - source
  additionalProperties: false
  properties:
    station:
      $ref: '#/StopRef'
    status:
      type: string
      enum:
        - scheduled
    windowMinutes:
      type: integer
      description: Effective lookahead window the board was computed with
    lines:
      type: array
      items:
        $ref: '#/DepartureLine'
    source:
      type: object
      required:
        - provider
        - requestedAt
      additionalProperties: false
      properties:
        provider:
          type: string
          description: '"schedule" — the in-house schedule snapshot'
        requestedAt:
          type: string
          format: date-time
          description: Server time the board was computed — the anchor for "now"
        snapshotAt:
          type: string
          format: date-time
          description: When the planner schedule snapshot was loaded

FareSegment:
  type: object
  required:
    - operator
    - from
    - to
    - amount
  additionalProperties: false
  properties:
    operator:
      type: string
    from:
      $ref: '#/JourneyStopRef'
    to:
      $ref: '#/JourneyStopRef'
    amount:
      type: integer
      format: int64
      description: IDR integer — money is never a float

Fare:
  type: object
  required:
    - currency
    - segments
  additionalProperties: false
  properties:
    currency:
      type: string
      enum:
        - IDR
    total:
      type: integer
      format: int64
    segments:
      type: array
      items:
        $ref: '#/FareSegment'

Itinerary:
  type: object
  description: >-
    One end-to-end plan computed by the in-house schedule planner. Labels
    name the trade-off this option actually wins against the others — an
    honest differentiator, not a ranking score.
  required:
    - label
    - departAt
    - arriveAt
    - durationSec
    - legs
    - walkTransfers
    - rideLegs
    - transfers
    - walkM
    - status
  additionalProperties: false
  properties:
    label:
      type: string
      enum:
        - fastest
        - fewest_transfers
        - least_walking
        - alternative
    reason:
      type: string
      description: What this option trades off, e.g. "avoids KCI:C"
    departAt:
      type: string
      format: date-time
    arriveAt:
      type: string
      format: date-time
    durationSec:
      type: integer
    legs:
      type: array
      items:
        $ref: '#/JourneyLeg'
    walkTransfers:
      type: integer
      description: Count of walk legs — computed from legs
    rideLegs:
      type: integer
    transfers:
      type: integer
      description: rideLegs - 1
    walkM:
      type: integer
      description: Total walking distance across walk legs
    status:
      type: string
      enum:
        - scheduled
        - estimated
      description: >-
        "scheduled" = every ride time is published; "estimated" = at least
        one leg rides a frequency template or reconstructed stop_time.
        Never live until realtime lands

JourneyPlan:
  type: object
  required:
    - from
    - to
    - query
    - itineraries
    - source
  additionalProperties: false
  properties:
    from:
      $ref: '#/JourneyStopRef'
    to:
      $ref: '#/JourneyStopRef'
    query:
      type: object
      description: The filters the plan was computed under — echoed back
      properties:
        departAt:
          type: string
          format: date-time
          description: Departure anchor — set even for "leave now"
        arriveBy:
          type: string
          format: date-time
        modes:
          type: array
          items:
            type: string
        maxWalkM:
          type: integer
        maxTransfers:
          type: integer
        stepFree:
          type: boolean
    itineraries:
      type: array
      description: >-
        Computed plans, best first — empty when no plan exists for the
        filters. Exactly one carries label "fastest"; the rest earn
        trade-off labels or plain "alternative".
      items:
        $ref: '#/Itinerary'
    fareReference:
      $ref: '#/Fare'
      description: >-
        Provider corridor fare estimate for the O-D pair — reference
        context, absent on upstream outage or when the pair is unknown
        upstream.
    source:
      type: object
      required:
        - provider
        - requestedAt
        - snapshotAt
      additionalProperties: false
      properties:
        provider:
          type: string
          description: '"schedule" — in-house planner over ingested data'
        requestedAt:
          type: string
          format: date-time
        snapshotAt:
          type: string
          format: date-time
          description: When the planner's schedule snapshot was loaded

RouteLineGeometry:
  type: object
  description: >-
    GeoJSON MultiLineString — the merged path for one route. Real ingested
    shapes and stop-sequence fallbacks both collect into MultiLineString
    (directions, patterns, and trunk/branch segments stay separate members).
  required:
    - type
    - coordinates
  properties:
    type:
      type: string
      enum:
        - MultiLineString
    coordinates:
      type: array
      items:
        type: array
        minItems: 2
        items:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number

RouteLineProperties:
  type: object
  required:
    - routeId
    - shortName
    - longName
    - mode
    - color
    - agencyName
    - source
  additionalProperties: false
  properties:
    routeId:
      type: string
      format: uuid
      description: Canonical route UUID
    shortName:
      type: string
      description: Line designation, e.g. 1, B, M
    longName:
      type: string
    mode:
      type: string
      enum:
        - rail
        - subway
        - tram
        - bus
        - ferry
        - other
    color:
      type: string
      description: >-
        Hex color without leading '#', same convention as RouteRef.color —
        empty when the operator publishes none
    agencyName:
      type: string
    source:
      type: string
      enum:
        - shape
        - stops
      description: >-
        'shape' = real ingested path geometry (GTFS/OSM); 'stops' =
        straight polyline through ordered stops — schematic, not surveyed

RouteLineFeature:
  type: object
  required:
    - type
    - geometry
    - properties
  additionalProperties: false
  properties:
    type:
      type: string
      enum:
        - Feature
    geometry:
      $ref: '#/RouteLineGeometry'
    properties:
      $ref: '#/RouteLineProperties'

RouteLineCollection:
  type: object
  description: GeoJSON FeatureCollection of route path geometries
  required:
    - type
    - features
  additionalProperties: false
  properties:
    type:
      type: string
      enum:
        - FeatureCollection
    features:
      type: array
      items:
        $ref: '#/RouteLineFeature'
