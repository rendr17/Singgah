openapi: 3.1.0
info:
  title: Singgah API
  version: 0.1.0
  description: >-
    Singgah backend contract (docs/34_API_SPEC.md). JSON UTF-8; timestamps are
    ISO-8601 with offset/UTC. Error responses share the ErrorEnvelope schema.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    $ref: './paths/health.yaml'
  /ready:
    $ref: './paths/ready.yaml'
  /version:
    $ref: './paths/version.yaml'
  /api/v1/stations:
    $ref: './paths/stations.yaml'
  /api/v1/stations/{id}:
    $ref: './paths/station-detail.yaml'
  /api/v1/routes:
    $ref: './paths/routes.yaml'
  /api/v1/routes/{id}:
    $ref: './paths/route-detail.yaml'
  /api/v1/providers:
    $ref: './paths/providers.yaml'
  /api/v1/journeys:
    $ref: './paths/journeys.yaml'
components:
  schemas:
    ErrorEnvelope:
      $ref: './schemas/error.yaml'
tags:
  - name: meta
    description: Process/infrastructure endpoints
  - name: catalog
    description: Canonical transit network — stations, routes, transfers
  - name: planner
    description: Station-to-station itinerary planning (scheduled data)
