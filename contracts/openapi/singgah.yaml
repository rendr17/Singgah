openapi: 3.1.0
info:
  title: Singgah API
  version: 0.1.0
  description: >-
    Singgah backend contract (docs/34_API_SPEC.md). JSON UTF-8; timestamps are
    ISO-8601 with offset/UTC. Error responses share the ErrorEnvelope schema.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    $ref: './paths/health.yaml'
  /ready:
    $ref: './paths/ready.yaml'
  /version:
    $ref: './paths/version.yaml'
  /api/v1/stations:
    $ref: './paths/stations.yaml'
  /api/v1/stations/{id}:
    $ref: './paths/station-detail.yaml'
  /api/v1/stations/{id}/departures:
    $ref: './paths/station-departures.yaml'
  /api/v1/routes:
    $ref: './paths/routes.yaml'
  /api/v1/routes/{id}:
    $ref: './paths/route-detail.yaml'
  /api/v1/providers:
    $ref: './paths/providers.yaml'
  /api/v1/map/lines:
    $ref: './paths/map-lines.yaml'
  /api/v1/journeys:
    $ref: './paths/journeys.yaml'
  /api/v1/auth/session:
    $ref: './paths/auth.yaml'
  /api/v1/auth/account:
    $ref: './paths/auth-account.yaml'
  /api/v1/visits:
    $ref: './paths/visits.yaml'
  /api/v1/passport/progress:
    $ref: './paths/passport-progress.yaml'
  /api/v1/journal:
    $ref: './paths/journal.yaml'
  /api/v1/journal/{id}:
    $ref: './paths/journal-detail.yaml'
  /api/v1/collections:
    $ref: './paths/collections.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token from POST /api/v1/auth/session (ADR-010).
  schemas:
    ErrorEnvelope:
      $ref: './schemas/error.yaml'
tags:
  - name: meta
    description: Process/infrastructure endpoints
  - name: catalog
    description: Canonical transit network — stations, routes, transfers
  - name: planner
    description: Station-to-station itinerary planning (scheduled data)
  - name: auth
    description: Anonymous session identity (ADR-010)
  - name: passport
    description: User-owned check-ins, progress, and journal
  - name: collections
    description: Curated editorial stop sets (docs/42 progress targets)
