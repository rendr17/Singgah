get:
  operationId: listSavedPlaces
  summary: List my saved places
  tags:
    - places
  security:
    - bearerAuth: []
  parameters:
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    '200':
      description: Private saved places for the authenticated session owner
      content:
        application/json:
          schema:
            $ref: '../schemas/places.yaml#/SavedPlaceList'
    '401':
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '../schemas/error.yaml'
    default:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '../schemas/error.yaml'
