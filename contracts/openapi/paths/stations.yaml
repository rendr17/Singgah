get:
  operationId: listStations
  summary: List and search stations and stops
  description: >-
    Three modes: with `bbox` returns stops inside the viewport
    (minLon,minLat,maxLon,maxLat — the map's scoped fetch); with `query`
    alone, case-insensitive search over display name, station code, and
    official name; with neither, the unfiltered reference list. `bbox` and
    `query` combine as "search within the viewport".
  tags:
    - catalog
  parameters:
    - name: query
      in: query
      schema:
        type: string
    - name: bbox
      in: query
      schema:
        type: string
        pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'
      description: 'WGS84 viewport: minLon,minLat,maxLon,maxLat'
      example: '106.70,-6.30,106.95,-6.10'
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 20
  responses:
    '200':
      description: Matching stations
      content:
        application/json:
          schema:
            type: object
            required:
              - stations
            additionalProperties: false
            properties:
              stations:
                type: array
                items:
                  $ref: '../schemas/catalog.yaml#/StationSummary'
    default:
      description: Error envelope — shared by all endpoints
      content:
        application/json:
          schema:
            $ref: '../schemas/error.yaml'
