get:
  operationId: getRoute
  summary: Route detail
  description: >-
    One canonical route with the stops it serves, in the provider's declared
    segment order. A route with no ingested sequence returns an empty list.
  tags:
    - catalog
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Route detail
      content:
        application/json:
          schema:
            type: object
            required:
              - route
            additionalProperties: false
            properties:
              route:
                $ref: '../schemas/catalog.yaml#/RouteDetail'
    default:
      description: Error envelope — shared by all endpoints
      content:
        application/json:
          schema:
            $ref: '../schemas/error.yaml'
