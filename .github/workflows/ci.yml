name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (pnpm + turbo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  go:
    name: Go services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: singgah
          POSTGRES_PASSWORD: singgah
          POSTGRES_DB: singgah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U singgah -d singgah"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: test -z "$(gofmt -l services)"
      - name: Apply migrations to the real database
        run: bash scripts/db-migrate.sh
        env:
          DATABASE_URL: postgres://singgah:singgah@localhost:5432/singgah?sslmode=disable
      - run: go vet ./...
        working-directory: services/api
      - run: go test ./...
        working-directory: services/api
        env:
          TEST_DATABASE_URL: postgres://singgah:singgah@localhost:5432/singgah?sslmode=disable
      - run: go build ./...
        working-directory: services/api
      - name: sqlc output must be committed
        run: |
          bash scripts/db-generate.sh
          if [ -n "$(git status --porcelain -- services/api/db/generated)" ]; then
            echo "sqlc drift — run 'bash scripts/db-generate.sh' and commit the output."
            git status --porcelain -- services/api/db/generated
            exit 1
          fi

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:validate
      - run: pnpm client:generate
      - name: Generated client must be committed
        run: |
          if [ -n "$(git status --porcelain -- packages/api-client/src/generated)" ]; then
            echo "Generated client drift — run 'pnpm client:generate' and commit the output."
            git status --porcelain -- packages/api-client/src/generated
            exit 1
          fi
