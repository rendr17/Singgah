version: '2'
sql:
  - engine: postgresql
    queries: queries
    # Declared catalog only — migrations/ contain goose Down DROPs, which sqlc
    # would apply after the Up DDL and end with an empty catalog.
    schema:
      - sqlc-catalog.sql
    gen:
      go:
        package: generated
        out: ../services/api/db/generated
        sql_package: pgx/v5
        emit_json_tags: true
